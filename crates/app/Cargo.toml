[package]
name = "rama-app"
description = "Explore git repositories: branch graph, commits and diffs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rama"
path = "src/main.rs"

[dependencies]
i18n.workspace = true
repo.workspace = true
graph.workspace = true
anyhow.workspace = true
notify = "7"
serde_json = "1"
# GitHub star count (one GET a day)
ureq = { version = "3", default-features = false, features = ["rustls"] }
# already in Cargo.lock through gpui; only process listing is used
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
otherwise-link.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true

[dev-dependencies]
tempfile = "3"

# build.rs embeds the .exe icon; only pulled in when building on Windows
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
libc = "0.2"
